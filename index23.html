
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#101713">
<title>Social Awareness Challenge</title>

<style>
:root {
  --bg: #101713;
  --panel: #19231d;
  --panel2: #222e26;
  --gold: #e7c477;
  --text: #f5f2e9;
  --muted: #a9b3aa;
  --green: #62c995;
  --red: #ef7777;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
}

body { min-height: 100dvh; }
button { font: inherit; }

.app {
  height: 100dvh;
  width: 100%;
  max-width: 620px;
  margin: auto;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.brand {
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 2.5px;
  font-weight: 800;
}

.counter {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.progress {
  height: 4px;
  border-radius: 20px;
  background: #303b33;
  margin-top: 17px;
  overflow: hidden;
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: width .3s ease;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.screen { display: none; }

.screen.active {
  display: flex;
  flex-direction: column;
}

.eyebrow {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 13px;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(34px, 9vw, 53px);
  line-height: 1.05;
  font-weight: 500;
  margin: 0 0 15px;
  letter-spacing: -1.5px;
}

h2 {
  font-family: Georgia, serif;
  font-weight: 500;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.15;
  margin: 0 0 12px;
}

.description {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin: 0 0 25px;
}

.primary {
  border: 0;
  border-radius: 13px;
  padding: 16px 20px;
  width: 100%;
  background: var(--gold);
  color: #171910;
  font-weight: 850;
  font-size: 15px;
  cursor: pointer;
  margin-top: 16px;
}

.primary:active { transform: scale(.99); }

.question-meta {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.question {
  font-family: Georgia, serif;
  font-size: clamp(24px, 6.5vw, 34px);
  line-height: 1.16;
  font-weight: 500;
  margin: 0 0 19px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option {
  position: relative;
  min-height: 66px;
  border: 1px solid #354239;
  border-radius: 13px;
  padding: 12px;
  background: var(--panel);
  color: var(--text);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.3;
  transition: border-color .2s ease, background .2s ease;
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.option.selected-good {
  border: 2px solid var(--green);
  background: #1c392c;
  font-weight: 800;
}

.option.selected-bad {
  border: 2px solid var(--red);
  background: #3b2525;
  font-weight: 800;
}

.option.reveal-good {
  border: 2px solid var(--green);
  background: var(--panel);
}

.option.reveal-bad {
  border: 2px solid var(--red);
  background: var(--panel);
}

.option .mark { display: none !important; }

.feedback {
  height: 42px;
  min-height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  font-size: 13px;
  font-weight: 800;
  margin-top: 12px;
}

.feedback.good { color: var(--green); }
.feedback.bad { color: var(--red); }

#next {
  height: 50px;
  min-height: 50px;
  flex-shrink: 0;
  margin-top: 4px;
  visibility: hidden;
}

#next[style*="display: block"] { visibility: visible; }

.footer {
  text-align: center;
  color: #758078;
  font-size: 10px;
  letter-spacing: 1px;
  padding-top: 12px;
  flex-shrink: 0;
}

.result-score {
  font-family: Georgia, serif;
  color: var(--gold);
  font-size: clamp(65px, 18vw, 100px);
  line-height: 1;
  margin: 12px 0;
}

.result-caption {
  color: var(--muted);
  font-size: 14px;
}

/* EXAMPLE VIDEO BUTTON */
.example-button {
  display: none;
  width: 100%;
  margin-top: 13px;
  padding: 13px 16px;
  border: 1px solid var(--gold);
  border-radius: 13px;
  background: transparent;
  color: var(--gold);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.example-button:active {
  background: #29382d;
}


/* VIDEO MODAL */
.example-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.88);
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

.example-modal.open {
  display: flex;
}

.example-content {
  position: relative;
  width: min(100%, 900px);
  max-height: calc(100dvh - 40px);
  padding: 42px 8px 8px;
  border-radius: 14px;
  background: #19231d;
  border: 1px solid var(--gold);
  overflow: hidden;
}

.example-close {
  position: absolute;
  top: 3px;
  right: 5px;
  border: none;
  background: transparent;
  color: white;
  font-size: 25px;
  cursor: pointer;
  padding: 3px 6px;
  z-index: 2;
}

#example-player {
  width: 100%;
  max-height: calc(100dvh - 100px);
}

#example-player iframe,
#example-player video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: calc(100dvh - 100px);
  border: 0;
  border-radius: 10px;
  background: #000;
}

#example-player video {
  height: auto;
}


@media (max-height: 650px) {
  .app { padding: 13px 16px; }
  .progress { margin-top: 11px; }
  .question { font-size: 24px; margin-bottom: 13px; }
  .option { min-height: 53px; padding: 9px; font-size: 12px; }
  .options { gap: 8px; }
  .feedback { height: 30px; min-height: 30px; margin-top: 6px; }
  #next { height: 43px; min-height: 43px; }
  .primary { padding: 13px; margin-top: 10px; }
}

@media (max-width: 360px) {
  .app { padding-left: 14px; padding-right: 14px; }
  .option { font-size: 11px; }
}

#game { width: 100%; }

button, .answer, .option {
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

button:focus,
button:focus-visible,
.answer:focus,
.answer:focus-visible,
.option:focus,
.option:focus-visible {
  outline: none;
  box-shadow: none;
}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="brand">SFIDA E NDËRGJEGJËSIMIT</div>
    <div class="counter" id="counter">PYETJE</div>
  </header>

  <div class="progress">
    <div class="progress-fill" id="progress"></div>
  </div>

  <main>
    <section class="screen active" id="intro">
      <div class="eyebrow" id="intro-count"></div>
      <h1>Mendo përtej<br>së dukshmes.</h1>
      <p class="description">
        Çdo pyetje ka katër alternativa. Tri janë të sakta dhe një është e gabuar.
        Zgjidh njërën nga alternativat për të fituar pikën.
      </p>
      <button class="primary" onclick="startQuiz()">FILLIMI I SFIDËS →</button>
    </section>

    <section class="screen" id="game">
      <div class="question-meta" id="category">KATEGORIA</div>
      <h2 class="question" id="question"></h2>

      <div class="options" id="options"></div>

      <button class="example-button" id="example-button" type="button">
        ▶ SHIKO SHEMBULL
      </button>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <button class="primary next" id="next" onclick="nextQuestion()" style="display:none">
        PYETJA TJETËR →
      </button>
    </section>

    <section class="screen" id="result">
      <div class="eyebrow">Sfida përfundoi</div>
      <h1>Rezultati<br>yt përfundimtar</h1>
      <div class="result-score">
        <span id="score">0</span>
        <span style="font-size:30px;color:var(--muted)"> / <span id="total-score"></span></span>
      </div>
      <p class="result-caption" id="resultText"></p>
      <button class="primary" onclick="restartQuiz()">LUAJ PËRSËRI ↻</button>
    </section>
  </main>

  <footer class="footer">
    NJË PYETJE NË ÇDO HAP · BËJ ZGJEDHJEN TËNDE
  </footer>
</div>


<!-- VIDEO POP-UP -->
<div class="example-modal" id="example-modal" role="dialog" aria-modal="true">
  <div class="example-content">
    <button class="example-close" type="button" onclick="closeExample()" aria-label="Mbyll">✕</button>
    <div id="example-player"></div>
  </div>
</div>

  ["Barazia","Si duhet të trajtohen komunitetet e ndryshme?",["Me dyshim që në fillim","Me fyerje","Duke përhapur stereotipe","Me drejtësi dhe respekt"],3,""],

  // 9. PËRGJEGJËSIA NDAJ MJEDISIT

  ["Mjedisi","Ku duhet të hidhen bateritë e përdorura?",["Në lumë","Në rrugë","Në një pikë të posaçme grumbullimi","Në këndin e lojërave"],2,""],

  ["Mjedisi","Si duhet ta hedhësh vajin e përdorur të gatimit?",["Në lumë","Në një pikë të përshtatshme grumbullimi","Në rrugë","Në kanalizimet e ujërave të shiut"],1,""],

  ["Mjedisi","Ku duhet të hidhen shishet plastike?",["Në det","Në anë të rrugës","Në koshin e riciklimit, kur është i disponueshëm","Në pyll"],2,""],

  ["Mjedisi","Si duhet t'i trajtosh pemët në hapësirat publike?",["T'i presësh pa arsye","T'i mbrosh","T'i gdhendësh dhe t'i dëmtosh","T'u vësh zjarrin"],1,""],

  ["Mjedisi","Si mund ta zvogëlosh përdorimin e panevojshëm të plastikës?",["Të përdorësh produkte të ripërdorshme","Ta hedhësh plastikën në natyrë","Ta djegësh në ambient të hapur","Ta hedhësh në ujëra"],0,""],

  ["Mjedisi","Çfarë duhet të bësh me një rubinet që rrjedh kot?",["Ta lësh hapur","Të shpërdorosh ujin","Të injorosh rrjedhjen","Ta mbyllësh"],3,""]

];

let index = 0;
let score = 0;
let answered = false;

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function startQuiz() {
  index = 0;
  score = 0;

  $("intro-count").textContent =
    `${questions.length} pyetje · Një zgjedhje në çdo hap`;

  $("total-score").textContent = questions.length;

  showScreen("game");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[index];

  $("counter").textContent = `${index + 1} / ${questions.length}`;
  $("progress").style.width = `${(index / questions.length) * 100}%`;
  $("category").textContent = q[0];
  $("question").textContent = q[1];

  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  $("next").style.display = "block";
  $("next").style.visibility = "hidden";

  // Configure the example button for this question
  const exampleUrl = q[4] || "";
  const exampleButton = $("example-button");

exampleButton.style.display = "none";
exampleButton.onclick = () => {
  if (exampleUrl.trim()) openExample(exampleUrl.trim());
};

  const options = $("options");
  options.innerHTML = "";

  q[2].forEach((option, i) => {
    const button = document.createElement("button");
    button.className = "option";

    button.innerHTML = `
      <span>${escapeHTML(option)}</span>
      <span class="mark"></span>
    `;

    button.addEventListener("click", () => chooseAnswer(i));
    options.appendChild(button);
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function chooseAnswer(choice) {
  if (answered) return;
  answered = true;
  const exampleButton = $("example-button");

if (questions[index][4] && questions[index][4].trim() !== "") {
  exampleButton.style.display = "block";
}

  const q = questions[index];
  const wrongChoice = q[3];
  const isCorrect = choice !== wrongChoice;

  if (isCorrect) score++;

  [...$("options").children].forEach((button, i) => {
    button.disabled = true;

    if (i === choice) {
      button.classList.add(isCorrect ? "selected-good" : "selected-bad");
    } else {
      button.classList.add(
        i === wrongChoice ? "reveal-bad" : "reveal-good"
      );
    }
  });

  $("feedback").textContent = isCorrect
    ? "✓ +1 PIKË"
    : "✕ NUK FITOVE PIKË";

  $("feedback").className = `feedback ${isCorrect ? "good" : "bad"}`;

  $("next").textContent =
    index === questions.length - 1
      ? "SHIKO REZULTATIN →"
      : "PYETJA TJETËR →";

  $("next").style.visibility = "visible";
}

function nextQuestion() {
  index++;

  if (index >= questions.length) {
    $("score").textContent = score;
    $("resultText").textContent =
      `Ke fituar ${score} nga ${questions.length} pikë.`;

    $("counter").textContent = "PËRFUNDUAR";
    $("progress").style.width = "100%";

    showScreen("result");
  } else {
    renderQuestion();
  }
}

function restartQuiz() {
  closeExample();

  $("progress").style.width = "0%";
  $("counter").textContent = `${questions.length} PYETJE`;

  showScreen("intro");
}

/* VIDEO PLAYER */



function openExample(url) {
  const player = $("example-player");
  player.innerHTML = "";

  const youtubeMatch = url.match(
    /(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  );

  if (youtubeMatch) {
    const videoId = youtubeMatch[1];
    const iframe = document.createElement("iframe");

    iframe.src =
      `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1`;

    iframe.title = "Video shembull";
    iframe.allow =
      "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
iframe.setAttribute("referrerpolicy", "strict-origin");
    player.appendChild(iframe);
  } else {
    const video = document.createElement("video");

    video.src = url;
    video.controls = true;
    video.playsInline = true;
    video.autoplay = true;
    video.muted = true;
    video.preload = "auto";

    player.appendChild(video);

    video.play().catch(error => {
      console.log("Autoplay was blocked:", error);
    });
  }

  $("example-modal").classList.add("open");
}



function closeExample() {
  $("example-modal").classList.remove("open");
  $("example-player").innerHTML = "";
}

$("example-modal").addEventListener("click", event => {
  if (event.target === $("example-modal")) {
    closeExample();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeExample();
  }
});

// Initialize the displayed question count
$("counter").textContent = `${questions.length} PYETJE`;
$("intro-count").textContent =
  `${questions.length} pyetje · Një zgjedhje në çdo hap`;
$("total-score").textContent = questions.length;
</script>
